[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp5d"
version = "0.1.0"
description = "Symmetry-controlled exceptional topology of the massive scalar QNM spectrum of doubly rotating 5D Myers-Perry black holes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "mpmath>=1.3",
  "sympy>=1.13",
]

[project.optional-dependencies]
certify = ["python-flint>=0.9"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mp5d"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: long-running searches, excluded from CI smoke runs",
]
