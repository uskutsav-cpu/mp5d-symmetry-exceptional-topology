line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]  # ambiguous name 'l' is standard notation for angular momentum here

[lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/**" = ["E501"]
# Each transcribed table row is kept on one line so it lines up visually with
# the corresponding row of the source paper; wrapping them would make
# proof-reading the transcription against the PDF materially harder.
"scripts/build_huang_huang_manifest.py" = ["E501"]
