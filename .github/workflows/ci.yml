name: CI

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Lint
        run: |
          pip install ruff
          ruff check . --exclude .venv
      - name: Tests (bounded; slow searches excluded)
        run: pytest -q -m "not slow"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: detect-secrets against audited baseline
        run: |
          pip install detect-secrets
          # Fails if any NEW finding appears that is not already audited in
          # .secrets.baseline.  The baseline's existing entries are provenance
          # hashes (sha256 of requirements.lock), audited as is_secret: false.
          detect-secrets scan --baseline .secrets.baseline --exclude-files '^\.venv/'
          git diff --exit-code .secrets.baseline \
            || { echo "New potential secret detected; review .secrets.baseline"; exit 1; }
