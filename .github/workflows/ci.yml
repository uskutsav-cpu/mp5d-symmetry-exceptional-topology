name: CI

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Lint
        run: |
          pip install ruff
          ruff check . --exclude .venv
      - name: Tests (bounded; slow searches excluded)
        run: pytest -q -m "not slow"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: detect-secrets against audited baseline
        run: |
          pip install detect-secrets
          cp .secrets.baseline .secrets.baseline.orig
          detect-secrets scan --baseline .secrets.baseline --exclude-files '^\.venv/'
          python - <<'EOF'
          import json, sys

          def findings(path):
              d = json.load(open(path))
              # compare only the findings themselves; detect-secrets rewrites a
              # `generated_at` timestamp on every run, which is not a signal.
              return {
                  (f, i["type"], i.get("line_number"))
                  for f, items in d.get("results", {}).items()
                  for i in items
                  if i.get("is_secret") is not False
              }

          new = findings(".secrets.baseline") - findings(".secrets.baseline.orig")
          if new:
              print("New unaudited potential secrets:")
              for x in sorted(map(str, new)):
                  print("  ", x)
              sys.exit(1)
          print("no new secrets beyond the audited baseline")
          EOF
