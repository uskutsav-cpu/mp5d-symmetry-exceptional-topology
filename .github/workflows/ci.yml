name: CI

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Lint
        run: |
          pip install ruff
          ruff check . --exclude .venv
      - name: Tests (bounded; slow searches excluded)
        run: pytest -q -m "not slow"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: detect-secrets over the working tree
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files > .ds.json
          python - <<'PY'
          import json, sys
          res = json.load(open(".ds.json")).get("results", {})
          allowed = {"results/symmetry_multiplets.json"}  # provenance hash, not a secret
          bad = {f: v for f, v in res.items() if f not in allowed}
          if bad:
              print("Potential secrets found:")
              for f in bad:
                  print(" ", f, [i.get("type") for i in bad[f]])
              sys.exit(1)
          print("no unexpected secrets")
          PY
