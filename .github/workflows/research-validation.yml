name: Research validation (manual)

# Expensive scientific validation. Never runs on push: it is the full suite
# including tests marked `slow`, plus the reproduction scripts.
on:
  workflow_dispatch:
    inputs:
      run_scans:
        description: "Also run bounded parameter scans"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Full suite including slow tests
        run: pytest -q
      - name: Reproduce core analytic artifacts
        run: python scripts/build_symmetry_multiplets.py --l-max 8
      - name: Baseline reproduction
        run: python scripts/validate_baseline.py || echo "baseline script not yet present"
